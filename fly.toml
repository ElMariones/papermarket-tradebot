# fly.toml app configuration file generated for tradebot-polymarket on 2026-06-19T14:45:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tradebot-polymarket'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TRADEBOT_DB_PATH = '/data/portfolio.db'
  TRADEBOT_STANDALONE = '1'
  TRADEBOT_START_BALANCE = '200'

[[mounts]]
  source = 'tradebot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
